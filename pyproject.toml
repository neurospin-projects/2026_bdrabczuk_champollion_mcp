[project]
name = "champollion-sulcal-mcp"
version = "0.1.0"
description = "FastMCP server wrapping the Champollion sulcal embedding pipeline"
requires-python = ">=3.11,<3.13"
authors = [{name = "Neurospin"}]
dependencies = [
  "fastmcp>=3.2.4",
  "pydantic>=2.7",
  "anyio>=4.4",
]

[project.scripts]
champollion-sulcal-mcp = "champollion_sulcal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champollion_sulcal_mcp"]

[tool.ruff]
line-length = 120
exclude = [".pixi", "external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast unit tests", "integration: slower integration tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 85
